<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | Vocabler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('vocabler_theme') || 'dark';
            if (savedTheme === 'light') document.documentElement.classList.add('light-theme');
            document.documentElement.classList.add('no-transition');
            window.addEventListener('load', () => {
                setTimeout(() => document.documentElement.classList.remove('no-transition'), 100);
            });
        })();
    </script>
    <style>
        .auth-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #393E46, #222831);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
        }
        @media (max-width: 576px) {
            .login-card {
                border-radius: 0;
                max-width: 100%;
                border-left: none;
                border-right: none;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="custom-card login-card text-center">
        <a href="index.html" class="text-decoration-none h1 fw-bold mb-2 d-block" style="color: var(--accent); letter-spacing: -1px;">Vocabler</a>
        <p class=" mb-4 small" data-i18n="register_title">Kelime dünyasına adım at</p>

        <form id="registerForm">
            <div class="row mb-3">
                <div class="col-6 text-start">
                    <label class="form-label small ms-2" data-i18n="label_name">Ad</label>
                    <input type="text" name="name" class="form-control" placeholder="Adınız" data-i18n="placeholder_name" required>
                </div>
                <div class="col-6 text-start">
                    <label class="form-label small ms-2" data-i18n="label_surname">Soyad</label>
                    <input type="text" name="surname" class="form-control" placeholder="Soyadınız" data-i18n="placeholder_surname" required>
                </div>
            </div>
            
            <div class="mb-3 text-start">
                <label class="form-label small ms-2" data-i18n="label_username">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" placeholder="kullanici_adi" data-i18n="placeholder_username" required>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label small ms-2" data-i18n="label_email">E-posta Adresi</label>
                <input type="email" name="email" class="form-control" placeholder="örnek@gmail.com" data-i18n="placeholder_email" required>
            </div>

            <div class="row mb-3">
                <div class="col-6 text-start">
                    <label class="form-label small  ms-2" data-i18n="label_main_lang">Ana Dil</label>
                    <select class="form-select" id="nativeLanguage" name="nativeLangId" required>
                        <option value="" disabled selected data-i18n="topics_loading">Yükleniyor...</option>
                    </select>
                </div>
                <div class="col-6 text-start">
                    <label class="form-label small  ms-2" data-i18n="label_target_lang">Öğrenilecek Dil</label>
                    <select class="form-select" id="targetLanguage" name="targetLangId" required>
                        <option value="" disabled selected data-i18n="topics_loading">Yükleniyor...</option>
                    </select>
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label small ms-2" data-i18n="label_password">Şifre</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary w-100 mb-4 py-3" data-i18n="btn_register">Kayıt Ol</button>
        </form>

        <p class="mb-0 small opacity-75" style="color: #EEEEEE;">
            <a href="login.html" class="text-decoration-none" style="color: inherit;">
                <span data-i18n="link_have_account">Zaten hesabın var mı? Giriş Yap</span>
            </a>
        </p>
        <div class="mt-4 pt-3 border-top border-white border-opacity-10">
            <a href="index.html" class="text-decoration-none small opacity-50 text-white"><i class="fas fa-arrow-left me-1"></i> <span data-i18n="btn_back_home">Ana Sayfaya Dön</span></a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/translations.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
