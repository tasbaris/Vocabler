<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum | Vocabler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #393E46, #222831);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
        }
        @media (max-width: 576px) {
            .login-card {
                border-radius: 0;
                max-width: 100%;
                border-left: none;
                border-right: none;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="custom-card login-card text-center">
        <a href="index.html" class="text-decoration-none h1 fw-bold mb-2 d-block" style="color: var(--accent); letter-spacing: -1px;">Vocabler</a>
        <p class="mb-4 small" style="color: var(--text);" data-i18n="forgot_password_title">Şifreni Sıfırla</p>

        <p class="small opacity-75 mb-4 text-start" data-i18n="forgot_password_desc">Kayıtlı e-posta adresini girerek şifre sıfırlama bağlantısı alabilirsin.</p>

        <form id="forgotPasswordForm">
            <div class="mb-4 text-start">
                <label class="form-label small ms-2" data-i18n="label_email">E-posta Adresi</label>
                <input type="email" class="form-control" placeholder="örnek@gmail.com" data-i18n="placeholder_email" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-4 py-3" data-i18n="btn_send_link">Bağlantı Gönder</button>
        </form>

        <div class="mt-4 pt-3 border-top border-white border-opacity-10">
            <a href="login.html" class="text-decoration-none small opacity-50 text-white hover-opacity-100"><i class="fas fa-arrow-left me-1"></i> <span data-i18n="link_back_to_login">Giriş Yap'a Dön</span></a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/translations.js"></script>
<script src="assets/js/theme.js"></script>
</body>
</html>
