<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>anasayfa</title>
        <link rel="stylesheet" href="main.css">
        <style>body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ececec, #dcdcdc);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.quiz-container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.progress-bar {
    width: 60%;
    height: 10px;
    background: #eee;
    border-radius: 10px;
}

.progress {
    width: 30%;
    height: 100%;
    background: #4CAF50;
    border-radius: 10px;
}

.question {
    text-align: center;
    margin: 30px 0;
}

.question img {
    width: 120px;
    margin-top: 10px;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.option {
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #f5f5f5;
    cursor: pointer;
    transition: 0.3s;
}

.option:hover {
    background: #ddd;
}</style>
    </head>
    <body>
        <header class="header">
            <a href="main.html" class="logo">Logo</a>

            <nav class="nav">
                <a href="main.html" class="nav-link">Anasayfa</a>
                <a href="quiz.html" class="nav-link">Quiz</a>
                <a href="#" class="nav-link">Konular</a>
                <a href="wordle.html" class="nav-link">Wordle</a>
                <a href="wordchain.html" class="nav-link">Wordchain</a>
            </nav>

            <div class="auth-area">
                <div class="guest">
                    <a href="#" class="login-btn">Giriş</a>
                    <a href="#" class="register-btn">Kayıt Ol</a>
                </div>
                <div class="user" style="display:none;">
                    <a href="#" class="profile-btn">Profil</a>
                </div>
            </div>
        </header>

        <main>
            <div class="quiz-container">
    
    <div class="quiz-header">
        <span>3 / 10</span>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
    </div>

    <div class="question">
        <h1>APPLE</h1>
        <img src="apple.jpg" alt="word-image">
    </div>

    <div class="answers">
        <button class="option">Elma</button>
        <button class="option">Armut</button>
        <button class="option">Muz</button>
        <button class="option">Portakal</button>
    </div>

</div>
            
        </main>


        <footer>

        </footer>

    </body>
</html>
