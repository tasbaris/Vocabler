<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | Vocabler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('vocabler_theme') || 'dark';
            if (savedTheme === 'light') document.documentElement.classList.add('light-theme');
            document.documentElement.classList.add('no-transition');
            window.addEventListener('load', () => {
                setTimeout(() => document.documentElement.classList.remove('no-transition'), 100);
            });
        })();
    </script>
    <style>
        .quiz-card {
            max-width: 600px;
            margin: 0 auto;
        }
        .option-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            text-align: left;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: var(--transition);
            width: 100%;
        }
        .option-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }
        @media (max-width: 576px) {
            .display-4 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
            <a href="index.html" class="text-decoration-none h4 fw-bold mb-0" style="color: var(--accent);">Vocabler</a>
            <button class="btn btn-link text-white d-lg-none p-0" id="closeSidebar"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-menu">
            <p class="small  fw-bold text-uppercase mb-3 px-3">Menü</p>
            <a href="dashboard.html" class="menu-item"><i class="fas fa-home"></i> Dashboard</a>
            <a href="my-words.html" class="menu-item"><i class="fas fa-book-open"></i> Kelimelerim</a>
            <a href="topics.html" class="menu-item"><i class="fas fa-layer-group"></i> Konular</a>
            <p class="small  fw-bold text-uppercase mt-4 mb-3 px-3">Oyunlar & Testler</p>
            <a href="quiz.html" class="menu-item active"><i class="fas fa-tasks"></i> Quiz Çöz</a>
            <a href="wordle.html" class="menu-item"><i class="fas fa-border-all"></i> Wordle</a>
            <a href="wordchain.html" class="menu-item"><i class="fas fa-link"></i> Kelime Zinciri</a>
            <p class="small  fw-bold text-uppercase mt-4 mb-3 px-3">Hesap</p>
            <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i> Ayarlar</a>
        </div>
        <div class="sidebar-footer">
            <button class="menu-item border-0 bg-transparent w-100 theme-toggle" title="Tema Değiştir">
                <i class="fas fa-moon"></i> Tema Değiştir
            </button>
            <a href="login.html" class="menu-item text-danger">
                <i class="fas fa-sign-out-alt"></i> Çıkış Yap
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-white p-0 me-3 d-lg-none" id="openSidebar"><i class="fas fa-bars fs-5"></i></button>
                <h5 class="mb-0 fw-bold">Quiz</h5>
            </div>
            <a href="settings.html" class="profile-pill">
                <img src="https://ui-avatars.com/api/?name=Nuri+Cevik&background=00ADB5&color=222831" alt="Avatar">
                <span class="fw-medium small d-none d-sm-inline">Nuri Çevik</span>
            </a>
        </header>

        <div class="container-fluid p-4">
            <div class="custom-card quiz-card shadow-lg">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <span class="badge bg-dark px-3 py-2 border border-secondary text-white-50">Soru 3 / 10</span>
                    <div class="w-50">
                        <div class="progress" style="height: 8px; background: rgba(255,255,255,0.05);">
                            <div class="progress-bar" role="progressbar" style="width: 30%; background: var(--accent);"></div>
                        </div>
                    </div>
                </div>

                <div class="text-center my-4">
                    <h1 class="display-4 fw-bold mb-3" style="letter-spacing: 2px;">APPLE</h1>
                    <div class="mb-4"><i class="fas fa-apple-alt fa-5x opacity-25"></i></div>
                    <p class="">Bu kelimenin Türkçe karşılığı nedir?</p>
                </div>

                <div class="options-list">
                    <button class="option-btn"><span class="me-3 opacity-50 fw-bold">A</span> Elma</button>
                    <button class="option-btn"><span class="me-3 opacity-50 fw-bold">B</span> Armut</button>
                    <button class="option-btn"><span class="me-3 opacity-50 fw-bold">C</span> Muz</button>
                    <button class="option-btn"><span class="me-3 opacity-50 fw-bold">D</span> Portakal</button>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-link text-decoration-none p-0 small "><i class="fas fa-flag me-2"></i>Bildir</button>
                    <button class="btn btn-primary px-4 rounded-pill">Sonraki Soru <i class="fas fa-arrow-right ms-2"></i></button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const openBtn = document.getElementById('openSidebar');
    const closeBtn = document.getElementById('closeSidebar');
    if(openBtn) openBtn.addEventListener('click', () => sidebar.classList.add('show'));
    if(closeBtn) closeBtn.addEventListener('click', () => sidebar.classList.remove('show'));
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/theme.js"></script>
</body>
</html>
