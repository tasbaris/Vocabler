<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | Vocabler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .quiz-wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 80px; /* Navbar yüksekliği */
        }
        .quiz-card {
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }
        .option-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            text-align: left;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: var(--transition);
            width: 100%;
        }
        .option-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: var(--accent);">Vocabler</a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fas fa-bars text-white"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Anasayfa</a></li>
                    <li class="nav-item"><a class="nav-link active" href="quiz.html">Quiz</a></li>
                    <li class="nav-item"><a class="nav-link" href="topics.html">Konular</a></li>
                    <li class="nav-item"><a class="nav-link" href="wordle.html">Wordle</a></li>
                    <li class="nav-item"><a class="nav-link" href="wordchain.html">Wordchain</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="profile.html" class="profile-pill">
                        <img src="https://ui-avatars.com/api/?name=Nuri+Cevik&background=00ADB5&color=222831" alt="Avatar">
                        <span class="fw-medium small d-none d-sm-inline">Nuri Çevik</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="quiz-wrapper">
        <div class="custom-card quiz-card shadow-lg">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="badge bg-dark px-3 py-2 border border-secondary text-white-50">Soru 3 / 10</span>
                <div class="w-50">
                    <div class="progress" style="height: 8px; background: rgba(255,255,255,0.05);">
                        <div class="progress-bar" role="progressbar" style="width: 30%; background: var(--accent);" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>
            </div>

            <div class="text-center my-5">
                <h1 class="display-4 fw-bold mb-3" style="letter-spacing: 2px;">APPLE</h1>
                <div class="mb-4">
                    <i class="fas fa-apple-alt fa-5x opacity-25"></i> <!-- Yeni ikon -->
                </div>
                <p class="text-muted">Bu kelimenin Türkçe karşılığı nedir?</p>
            </div>

            <div class="options-list">
                <button class="option-btn">
                    <span class="me-3 opacity-50 fw-bold">A</span> Elma
                </button>
                <button class="option-btn">
                    <span class="me-3 opacity-50 fw-bold">B</span> Armut
                </button>
                <button class="option-btn">
                    <span class="me-3 opacity-50 fw-bold">C</span> Muz
                </button>
                <button class="option-btn">
                    <span class="me-3 opacity-50 fw-bold">D</span> Portakal
                </button>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <button class="btn btn-link text-decoration-none text-muted p-0"><i class="fas fa-flag me-2"></i>Bildir</button>
                <button class="btn btn-primary px-4">Sonraki Soru <i class="fas fa-arrow-right ms-2"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
