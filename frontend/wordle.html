<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle | Vocabler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .game-wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
        }
        .wordle-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 40px;
        }
        .wordle-row {
            display: flex;
            gap: 8px;
        }
        .keyboard-layout {
            max-width: 600px;
        }
        .key-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 15px 0;
            border-radius: 6px;
            font-weight: 500;
            transition: var(--transition);
            flex: 1;
            min-width: 30px;
            text-transform: uppercase;
        }
        .key-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }
        .key-btn.wide {
            flex: 1.5;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: var(--accent);">Vocabler</a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fas fa-bars text-white"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Anasayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="quiz.html">Quiz</a></li>
                    <li class="nav-item"><a class="nav-link" href="topics.html">Konular</a></li>
                    <li class="nav-item"><a class="nav-link active" href="wordle.html">Wordle</a></li>
                    <li class="nav-item"><a class="nav-link" href="wordchain.html">Wordchain</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="profile.html" class="profile-pill">
                        <img src="https://ui-avatars.com/api/?name=Nuri+Cevik&background=00ADB5&color=222831" alt="Avatar">
                        <span class="fw-medium small d-none d-sm-inline">Nuri Çevik</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="game-wrapper">
        <h2 class="fw-bold mb-5">Günün Kelimesini Bul</h2>
        
        <!-- Grid -->
        <div class="wordle-grid">
            <div class="wordle-row">
                <div class="wordle-cell">W</div>
                <div class="wordle-cell">O</div>
                <div class="wordle-cell">R</div>
                <div class="wordle-cell" style="background-color: #6aaa64; border-color: #6aaa64; color: white;">D</div>
                <div class="wordle-cell">S</div>
            </div>
            <div class="wordle-row">
                <div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div>
            </div>
            <div class="wordle-row">
                <div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div>
            </div>
            <div class="wordle-row">
                <div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div>
            </div>
            <div class="wordle-row">
                <div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div>
            </div>
            <div class="wordle-row">
                <div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div>
            </div>
        </div>

        <!-- Keyboard -->
        <div class="keyboard-layout container-fluid">
            <div class="d-flex justify-content-center gap-2 mb-2">
                <button class="key-btn">Q</button><button class="key-btn">W</button><button class="key-btn">E</button>
                <button class="key-btn">R</button><button class="key-btn">T</button><button class="key-btn">Y</button>
                <button class="key-btn">U</button><button class="key-btn">I</button><button class="key-btn">O</button>
                <button class="key-btn">P</button>
            </div>
            <div class="d-flex justify-content-center gap-2 mb-2 ps-4 pe-4">
                <button class="key-btn">A</button><button class="key-btn">S</button><button class="key-btn">D</button>
                <button class="key-btn">F</button><button class="key-btn">G</button><button class="key-btn">H</button>
                <button class="key-btn">J</button><button class="key-btn">K</button><button class="key-btn">L</button>
            </div>
            <div class="d-flex justify-content-center gap-2">
                <button class="key-btn wide">ENTER</button>
                <button class="key-btn">Z</button><button class="key-btn">X</button><button class="key-btn">C</button>
                <button class="key-btn">V</button><button class="key-btn">B</button><button class="key-btn">N</button>
                <button class="key-btn">M</button>
                <button class="key-btn wide"><i class="fas fa-backspace"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
