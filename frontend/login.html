<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Vocabler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #393E46, #222831);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .social-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 10px;
            border-radius: 12px;
            transition: var(--transition);
        }
        .social-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <!-- Login Card -->
    <div class="custom-card login-card text-center" id="loginCard">
        <a href="index.html" class="text-decoration-none h1 fw-bold mb-2 d-block" style="color: var(--accent); letter-spacing: -1px;">Vocabler</a>
        <p class="text-muted mb-4 small">Öğrenmeye kaldığın yerden devam et</p>

        <form>
            <div class="mb-3 text-start">
                <label class="form-label small opacity-50 ms-2">E-posta Adresi</label>
                <input type="email" class="form-control" placeholder="örnek@gmail.com" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small opacity-50 ms-2">Şifre</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-4 py-3">Giriş Yap</button>
        </form>

        <div class="d-flex align-items-center mb-4">
            <hr class="flex-grow-1 opacity-10">
            <span class="px-3 small opacity-25 text-uppercase">veya</span>
            <hr class="flex-grow-1 opacity-10">
        </div>

        <div class="row g-2 mb-4">
            <div class="col-6">
                <button class="social-btn w-100"><i class="fab fa-google me-2"></i>Google</button>
            </div>
            <div class="col-6">
                <button class="social-btn w-100"><i class="fab fa-apple me-2"></i>Apple</button>
            </div>
        </div>

        <p class="mb-0 small opacity-75">Hesabın yok mu? <a href="javascript:void(0)" onclick="toggleAuth()" class="text-decoration-none" style="color: var(--accent);">Hemen Kayıt Ol</a></p>
    </div>

    <!-- Register Card -->
    <div class="custom-card login-card text-center d-none" id="registerCard">
        <a href="index.html" class="text-decoration-none h1 fw-bold mb-2 d-block" style="color: var(--accent); letter-spacing: -1px;">Vocabler</a>
        <p class="text-muted mb-4 small">Kelime dünyasına adım at</p>

        <form>
            <div class="mb-3 text-start">
                <label class="form-label small opacity-50 ms-2">Ad Soyad</label>
                <input type="text" class="form-control" placeholder="Adınız Soyadınız" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label small opacity-50 ms-2">E-posta Adresi</label>
                <input type="email" class="form-control" placeholder="örnek@gmail.com" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small opacity-50 ms-2">Şifre</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-4 py-3">Kayıt Ol</button>
        </form>

        <p class="mb-0 small opacity-75">Zaten hesabın var mı? <a href="javascript:void(0)" onclick="toggleAuth()" class="text-decoration-none" style="color: var(--accent);">Giriş Yap</a></p>
    </div>
</div>

<script>
    function toggleAuth() {
        const loginCard = document.getElementById('loginCard');
        const registerCard = document.getElementById('registerCard');
        loginCard.classList.toggle('d-none');
        registerCard.classList.toggle('d-none');
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
