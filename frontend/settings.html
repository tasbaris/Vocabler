<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayarlar | Vocabler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('vocabler_theme') || 'dark';
            if (savedTheme === 'light') document.documentElement.classList.add('light-theme');
            document.documentElement.classList.add('no-transition');
            window.addEventListener('load', () => {
                setTimeout(() => document.documentElement.classList.remove('no-transition'), 100);
            });
        })();
    </script>
</head>
<body>

<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
            <a href="index.html" class="text-decoration-none h4 fw-bold mb-0" style="color: var(--accent);">Vocabler</a>
            <button class="btn btn-link text-white d-lg-none p-0" id="closeSidebar"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="sidebar-menu">
            <p class="small fw-bold text-uppercase mb-3 px-3" data-i18n="nav_menu">Menü</p>
            <a href="dashboard.html" class="menu-item">
                <i class="fas fa-home"></i> <span data-i18n="nav_dashboard">Dashboard</span>
            </a>
            <a href="my-words.html" class="menu-item">
                <i class="fas fa-book-open"></i> <span data-i18n="nav_words">Kelimelerim</span>
            </a>
            <a href="topics.html" class="menu-item">
                <i class="fas fa-layer-group"></i> <span data-i18n="nav_topics">Konular</span>
            </a>
            
            <p class="small fw-bold text-uppercase mt-4 mb-3 px-3" data-i18n="nav_games">Oyunlar & Testler</p>
            <a href="quiz.html" class="menu-item">
                <i class="fas fa-tasks"></i> <span data-i18n="nav_quiz">Quiz Çöz</span>
            </a>
            <a href="wordle.html" class="menu-item">
                <i class="fas fa-border-all"></i> <span data-i18n="nav_wordle">Wordle</span>
            </a>
            <a href="wordchain.html" class="menu-item">
                <i class="fas fa-link"></i> <span data-i18n="nav_chain">Kelime Zinciri</span>
            </a>
            
            <p class="small fw-bold text-uppercase mt-4 mb-3 px-3" data-i18n="nav_account">Hesap</p>
            <a href="settings.html" class="menu-item active">
                <i class="fas fa-cog"></i> <span data-i18n="nav_settings">Ayarlar</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <button class="menu-item border-0 bg-transparent w-100 theme-toggle" title="Tema Değiştir">
                <i class="fas fa-moon"></i> <span data-i18n="nav_theme">Tema Değiştir</span>
            </button>
            <a href="javascript:void(0);" onclick="logout()" class="menu-item text-danger">
                <i class="fas fa-sign-out-alt"></i> <span data-i18n="nav_logout">Çıkış Yap</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-white p-0 me-3 d-lg-none" id="openSidebar">
                    <i class="fas fa-bars fs-5"></i>
                </button>
                <h5 class="mb-0 fw-bold d-none d-sm-block" data-i18n="nav_settings">Ayarlar</h5>
            </div>
            
            <a href="settings.html" class="profile-pill">
                <img alt="Avatar">
                <span class="fw-medium small d-none d-sm-inline userNameDisplay"></span>
            </a>
        </header>

        <!-- Content Area -->
        <div class="container-fluid p-4">
            
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    
                    <!-- Profile Settings -->
                    <div class="custom-card mb-4">
                        <h5 class="fw-bold mb-4 border-bottom border-white border-opacity-10 pb-3" data-i18n="footer_profile">Profil Bilgileri</h5>
                        
                        <div class="d-flex align-items-center gap-4 mb-4">
                            <!--id ekledim-->
                            <img class="rounded-circle" alt="Avatar" id="settingsBigAvatar">
                        </div>

                        <form id="profileForm">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label small opacity-50" data-i18n="label_full_name">Ad Soyad</label>
                                    <input type="text" class="form-control" id="settingsNameInput" name="fullName">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small opacity-50" data-i18n="label_level">Seviye</label>
                                    <select class="form-select" id="settingsLevelInput" name="level">
                                        <option value="A1">A1</option>
                                        <option value="A2">A2</option>
                                        <option value="B1">B1</option>
                                        <option value="B2">B2</option>
                                        <option value="C1">C1</option>
                                        <option value="C2">C2</option>
                                    </select>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label small opacity-50" data-i18n="label_email">E-posta Adresi</label>
                                    <input type="email" class="form-control" id="settingsEmailInput" name="email">
                                </div>
                            </div>
                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-primary px-4" data-i18n="btn_save">Değişiklikleri Kaydet</button>
                            </div>
                        </form>
                    </div>

                    <!-- Learning Preferences -->
                    <div class="custom-card mb-4">
                        <h5 class="fw-bold mb-4 border-bottom border-white border-opacity-10 pb-3" data-i18n="label_learning_preferences">Öğrenme Tercihleri</h5>
                        
                        <form id="preferencesForm">
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label small opacity-50 ms-2" data-i18n="label_main_lang">Ana Dil</label>
                                    <select class="form-select" id="nativeLanguage" name="nativeLanguage">
                                        <option value="" disabled selected data-i18n="topics_loading">Yükleniyor...</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small opacity-50 ms-2" data-i18n="label_target_lang">Öğrenilen Dil</label>
                                    <select class="form-select" id="targetLanguage" name="targetLanguage">
                                        <option value="" disabled selected data-i18n="topics_loading">Yükleniyor...</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small opacity-50 ms-2" data-i18n="dashboard_daily_goal">Günlük Hedef</label>
                                <div class="d-flex align-items-center gap-3">
                                    <input type="range" class="form-range flex-grow-1" min="1" max="100" step="1" value="10" id="goalSlider" name="dailyGoal">
                                    <span id="goalValue" class="badge bg-dark border border-secondary p-2">10</span>
                                </div>
                            </div>

                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-primary px-4" data-i18n="btn_save">Tercihleri Güncelle</button>
                            </div>
                        </form>
                    </div>

                    <!-- Security -->
                    <div class="custom-card">
                        <h5 class="fw-bold mb-4 text-danger border-bottom border-white border-opacity-10 pb-3" data-i18n="label_security">Güvenlik</h5>
                        <p class="small  mb-4" data-i18n="security_desc">Hesabınızın güvenliğini sağlamak için şifrenizi güncel tutun.</p>
                        <button class="btn btn-outline-danger" id="changePasswordBtn" data-i18n="btn_change_password">Şifre Değiştir</button>
                    </div>

                </div>
            </div>

        </div>
    </main>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const openBtn = document.getElementById('openSidebar');
    const closeBtn = document.getElementById('closeSidebar');

    if(openBtn) openBtn.addEventListener('click', () => sidebar.classList.add('show'));
    if(closeBtn) closeBtn.addEventListener('click', () => sidebar.classList.remove('show'));
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/translations.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/settings.js"></script>
</body>
</html>
