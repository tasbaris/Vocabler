<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayarlar | Vocabler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('vocabler_theme') || 'dark';
            if (savedTheme === 'light') document.documentElement.classList.add('light-theme');
            document.documentElement.classList.add('no-transition');
            window.addEventListener('load', () => {
                setTimeout(() => document.documentElement.classList.remove('no-transition'), 100);
            });
        })();
    </script>
</head>
<body>

<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
            <a href="index.html" class="text-decoration-none h4 fw-bold mb-0" style="color: var(--accent);">Vocabler</a>
            <button class="btn btn-link text-white d-lg-none p-0" id="closeSidebar"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="sidebar-menu">
            <p class="small  fw-bold text-uppercase mb-3 px-3">Menü</p>
            <a href="dashboard.html" class="menu-item">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="my-words.html" class="menu-item">
                <i class="fas fa-book-open"></i> Kelimelerim
            </a>
            <a href="topics.html" class="menu-item">
                <i class="fas fa-layer-group"></i> Konular
            </a>
            
            <p class="small  fw-bold text-uppercase mt-4 mb-3 px-3">Oyunlar & Testler</p>
            <a href="quiz.html" class="menu-item">
                <i class="fas fa-tasks"></i> Quiz Çöz
            </a>
            <a href="wordle.html" class="menu-item">
                <i class="fas fa-border-all"></i> Wordle
            </a>
            <a href="wordchain.html" class="menu-item">
                <i class="fas fa-link"></i> Kelime Zinciri
            </a>
            
            <p class="small  fw-bold text-uppercase mt-4 mb-3 px-3">Hesap</p>
            <a href="settings.html" class="menu-item active">
                <i class="fas fa-cog"></i> Ayarlar
            </a>
        </div>
        <div class="sidebar-footer">
            <button class="menu-item border-0 bg-transparent w-100 theme-toggle" title="Tema Değiştir">
                <i class="fas fa-moon"></i> Tema Değiştir
            </button>
            <a href="login.html" class="menu-item text-danger">
                <i class="fas fa-sign-out-alt"></i> Çıkış Yap
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-white p-0 me-3 d-lg-none" id="openSidebar">
                    <i class="fas fa-bars fs-5"></i>
                </button>
                <h5 class="mb-0 fw-bold d-none d-sm-block">Ayarlar</h5>
            </div>
            
            <a href="settings.html" class="profile-pill">
                <img src="https://ui-avatars.com/api/?name=Nuri+Cevik&background=00ADB5&color=222831" alt="Avatar">
                <span class="fw-medium small d-none d-sm-inline">Nuri Çevik</span>
            </a>
        </header>

        <!-- Content Area -->
        <div class="container-fluid p-4">
            
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    
                    <!-- Profile Settings -->
                    <div class="custom-card mb-4">
                        <h5 class="fw-bold mb-4 border-bottom border-white border-opacity-10 pb-3">Profil Bilgileri</h5>
                        
                        <div class="d-flex align-items-center gap-4 mb-4">
                            <img src="https://ui-avatars.com/api/?name=Nuri+Cevik&size=80&background=00ADB5&color=222831" class="rounded-circle" alt="Avatar">
                            <div>
                                <button class="btn btn-sm btn-outline-light border-opacity-25 mb-2"><i class="fas fa-upload me-2"></i>Fotoğraf Yükle</button>
                                <p class="small  mb-0">JPG veya PNG (Maks 2MB)</p>
                            </div>
                        </div>

                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small opacity-50 ms-2">Ad Soyad</label>
                                    <input type="text" class="form-control" value="Nuri Çevik">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small opacity-50 ms-2">E-posta Adresi</label>
                                    <input type="email" class="form-control" value="ornek@gmail.com" readonly>
                                </div>
                            </div>
                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-primary px-4">Değişiklikleri Kaydet</button>
                            </div>
                        </form>
                    </div>

                    <!-- Learning Preferences -->
                    <div class="custom-card mb-4">
                        <h5 class="fw-bold mb-4 border-bottom border-white border-opacity-10 pb-3">Öğrenme Tercihleri</h5>
                        
                        <form>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label small opacity-50 ms-2">Ana Dil</label>
                                    <select class="form-select" id="nativeLanguage">
                                        <option value="" disabled selected>Yükleniyor...</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small opacity-50 ms-2">Öğrenilen Dil</label>
                                    <select class="form-select" id="targetLanguage">
                                        <option value="" disabled selected>Yükleniyor...</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small opacity-50 ms-2">Günlük Hedef</label>
                                <div class="d-flex align-items-center gap-3">
                                    <input type="range" class="form-range flex-grow-1" min="5" max="50" step="5" value="15" id="goalSlider" oninput="document.getElementById('goalValue').innerText = this.value + ' Kelime'">
                                    <span id="goalValue" class="badge bg-dark border border-secondary p-2">15 Kelime</span>
                                </div>
                            </div>

                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-primary px-4">Tercihleri Güncelle</button>
                            </div>
                        </form>
                    </div>

                    <!-- Security -->
                    <div class="custom-card">
                        <h5 class="fw-bold mb-4 text-danger border-bottom border-white border-opacity-10 pb-3">Güvenlik</h5>
                        <p class="small  mb-4">Hesabınızın güvenliğini sağlamak için şifrenizi güncel tutun.</p>
                        <button class="btn btn-outline-danger">Şifre Değiştir</button>
                    </div>

                </div>
            </div>

        </div>
    </main>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const openBtn = document.getElementById('openSidebar');
    const closeBtn = document.getElementById('closeSidebar');

    if(openBtn) openBtn.addEventListener('click', () => sidebar.classList.add('show'));
    if(closeBtn) closeBtn.addEventListener('click', () => sidebar.classList.remove('show'));
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/theme.js"></script>
</body>
</html>
