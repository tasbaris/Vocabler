# Project identification
sonar.projectKey=Vocabler
sonar.projectName=Vocabler Language Learning Platform
sonar.projectVersion=1.0

# Source directories
# Note: Frontend (JS) is currently excluded due to environment-specific compatibility issues with the Sonar JS sensor.
sonar.sources=backend/api
sonar.exclusions=backend/vendor/**,backend/mysql_data/**

# Language specific configurations
sonar.php.file.suffixes=php

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Server configuration (Defaults, can be overridden by CLI)
# sonar.host.url=http://localhost:9000
# sonar.login=your_token_here
